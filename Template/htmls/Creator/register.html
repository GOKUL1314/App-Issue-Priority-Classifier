{% extends "base.html" %}

{% block title %}Creator Registration - App Issue Priority{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 border-top border-4 border-primary">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <div class="bg-primary-subtle text-primary p-3 rounded-circle d-inline-flex mb-2">
                        <i class="fa-solid fa-user-plus fs-3"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Create Creator Account</h3>
                    <p class="text-muted small">Register to submit app issues and get automated ML triage</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Full Name <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-id-card text-muted"></i></span>
                            <input type="text" name="full_name" class="form-control" placeholder="e.g. Alex Morgan" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Username <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Email Address <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-muted"></i></span>
                            <input type="email" name="email" class="form-control" placeholder="creator@example.com" required>
                        </div>
                    </div>

                    

                    <div class="mb-4">
                        <label class="form-label fw-semibold small">Password <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Create a strong password" required minlength="4">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3 shadow-sm">
                        <i class="fa-solid fa-user-check me-2"></i> Register Account
                    </button>
                </form>

                <div class="text-center pt-2 border-top">
                    <span class="text-muted small">Already have an account?</span>
                    <a href="{% url 'creator_login' %}" class="fw-semibold text-primary small ms-1">Login here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
